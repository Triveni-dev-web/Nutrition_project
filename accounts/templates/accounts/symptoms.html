<!DOCTYPE html>
<html>
<head>
    <title>Symptoms</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            margin-bottom: 25px;
        }

        h2 {
            margin-top: 30px;
        }

        form {
            margin-bottom: 20px;
        }

        table {
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #999;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        input[type="text"] {
            padding: 6px;
            width: 150px;
        }

        select {
            padding: 6px;
        }

        button {
            padding: 6px 12px;
            margin: 2px;
            cursor: pointer;
        }
    </style>
</head>


<body>

    <h1>My Symptoms</h1>


    <!-- ================= ADD SYMPTOM ================= -->

    <form method="POST">

        {% csrf_token %}

        <label>
            <b>Symptoms:</b>
        </label>

        <br><br>


        <input
            type="checkbox"
            name="symptoms"
            value="Headache"
        >
        Headache

        <br>


        <input
            type="checkbox"
            name="symptoms"
            value="Stomach Pain"
        >
        Stomach Pain

        <br>


        <input
            type="checkbox"
            name="symptoms"
            value="Fatigue"
        >
        Fatigue

        <br>


        <input
            type="checkbox"
            name="symptoms"
            value="Nausea"
        >
        Nausea

        <br>


        <input
            type="checkbox"
            name="symptoms"
            value="Dizziness"
        >
        Dizziness

        <br><br>


        <label>
            <b>Severity:</b>
        </label>


        <select name="severity">

            <option value="Mild">
                Mild
            </option>

            <option value="Moderate">
                Moderate
            </option>

            <option value="Severe">
                Severe
            </option>

        </select>


        <br><br>


        <button type="submit">
            Add Symptom
        </button>

    </form>


    <hr>


    <!-- ================= PREVIOUS SYMPTOMS ================= -->

    <h2>Previous Symptoms</h2>


    <table>

        <thead>

            <tr>
                <th>Date</th>
                <th>Symptom</th>
                <th>Severity</th>
                <th>Action</th>
            </tr>

        </thead>


        <tbody>


            {% for symptom in symptoms %}


            <tr>


                <!-- DATE -->

                <td>
                    {{ symptom.date|date:"M d, Y" }}
                </td>


                <!-- SYMPTOM -->

                <td>

                    <input
                        type="text"
                        id="name_{{ symptom.id }}"
                        value="{{ symptom.name }}"
                        disabled
                    >

                </td>


                <!-- SEVERITY -->

                <td>

                    <select
                        id="severity_{{ symptom.id }}"
                        disabled
                    >

                        <option
                            value="Mild"
                            {% if symptom.severity == "Mild" %}
                                selected
                            {% endif %}
                        >
                            Mild
                        </option>


                        <option
                            value="Moderate"
                            {% if symptom.severity == "Moderate" %}
                                selected
                            {% endif %}
                        >
                            Moderate
                        </option>


                        <option
                            value="Severe"
                            {% if symptom.severity == "Severe" %}
                                selected
                            {% endif %}
                        >
                            Severe
                        </option>

                    </select>

                </td>


                <!-- ACTION -->

                <td>


                    <!-- EDIT / SAVE FORM -->

                    <form
                        method="POST"
                        style="display: inline;"
                    >

                        {% csrf_token %}


                        <input
                            type="hidden"
                            name="action"
                            value="edit"
                        >


                        <input
                            type="hidden"
                            name="symptom_id"
                            value="{{ symptom.id }}"
                        >


                        <input
                            type="hidden"
                            name="name"
                            id="hidden_name_{{ symptom.id }}"
                        >


                        <input
                            type="hidden"
                            name="severity"
                            id="hidden_severity_{{ symptom.id }}"
                        >


                        <!-- EDIT BUTTON -->

                        <button
                            type="button"
                            class="edit-btn"
                            data-id="{{ symptom.id }}"
                        >
                            Edit
                        </button>


                        <!-- SAVE BUTTON -->

                        <button
                            type="submit"
                            class="save-btn"
                            data-id="{{ symptom.id }}"
                            style="display: none;"
                        >
                            Save
                        </button>

                    </form>


                    <!-- DELETE FORM -->

                    <form
                        method="POST"
                        style="display: inline;"
                    >

                        {% csrf_token %}


                        <input
                            type="hidden"
                            name="action"
                            value="delete"
                        >


                        <input
                            type="hidden"
                            name="symptom_id"
                            value="{{ symptom.id }}"
                        >


                        <button
                            type="submit"
                            onclick="return confirm('Delete this symptom?');"
                        >
                            Delete
                        </button>

                    </form>


                </td>


            </tr>


            {% empty %}


            <tr>

                <td colspan="4">
                    No symptoms recorded.
                </td>

            </tr>


            {% endfor %}


        </tbody>

    </table>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        // EDIT BUTTON

        document.querySelectorAll(".edit-btn").forEach(function(button) {

            button.addEventListener("click", function() {

                const id = this.dataset.id;


                // Enable symptom name

                document.getElementById(
                    "name_" + id
                ).disabled = false;


                // Enable severity

                document.getElementById(
                    "severity_" + id
                ).disabled = false;


                // Hide Edit button

                this.style.display = "none";


                // Show Save button

                document.querySelector(
                    '.save-btn[data-id="' + id + '"]'
                ).style.display = "inline";

            });

        });


        // SAVE BUTTON

        document.querySelectorAll(".save-btn").forEach(function(button) {

            button.addEventListener("click", function() {

                const id = this.dataset.id;


                // Copy edited name

                document.getElementById(
                    "hidden_name_" + id
                ).value =
                    document.getElementById(
                        "name_" + id
                    ).value;


                // Copy edited severity

                document.getElementById(
                    "hidden_severity_" + id
                ).value =
                    document.getElementById(
                        "severity_" + id
                    ).value;

            });

        });

    </script>


</body>
</html>
