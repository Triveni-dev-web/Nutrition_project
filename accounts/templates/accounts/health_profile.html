<!DOCTYPE html>
<html>
<head>
    <title>Health Profile</title>
</head>

<body>

<h1>My Health Profile</h1>

<form method="POST">

    {% csrf_token %}

    <!-- AGE -->
    <label>Age:</label>
    <input
        type="number"
        name="age"
        value="{{ profile.age|default:'' }}"
        required
    >
    <br><br>


    <!-- GENDER -->
    <label>Gender:</label>

    <select name="gender" required>

        <option value="">Select Gender</option>

        <option value="Male"
            {% if profile.gender == "Male" %}selected{% endif %}>
            Male
        </option>

        <option value="Female"
            {% if profile.gender == "Female" %}selected{% endif %}>
            Female
        </option>

        <option value="Other"
            {% if profile.gender == "Other" %}selected{% endif %}>
            Other
        </option>

    </select>

    <br><br>


    <!-- HEIGHT -->
    <label>Height (cm):</label>

    <input
        type="number"
        step="0.1"
        name="height"
        value="{{ profile.height|default:'' }}"
        required
    >

    <br><br>


    <!-- WEIGHT -->
    <label>Weight (kg):</label>

    <input
        type="number"
        step="0.1"
        name="weight"
        value="{{ profile.weight|default:'' }}"
        required
    >

    <br><br>


    <!-- ACTIVITY -->
    <label>Activity Level:</label>

    <select name="activity" required>

        <option value="">Select Activity</option>

        <option value="Low"
            {% if profile.activity == "Low" %}selected{% endif %}>
            Low
        </option>

        <option value="Moderate"
            {% if profile.activity == "Moderate" %}selected{% endif %}>
            Moderate
        </option>

        <option value="High"
            {% if profile.activity == "High" %}selected{% endif %}>
            High
        </option>

    </select>

    <br><br>


    <!-- HEALTH GOAL -->
    <label>Health Goal:</label>

    <select name="goal" required>

        <option value="">Select Goal</option>

        <option value="Weight Loss"
            {% if profile.goal == "Weight Loss" %}selected{% endif %}>
            Weight Loss
        </option>

        <option value="Weight Gain"
            {% if profile.goal == "Weight Gain" %}selected{% endif %}>
            Weight Gain
        </option>

        <option value="Maintain Weight"
            {% if profile.goal == "Maintain Weight" %}selected{% endif %}>
            Maintain Weight
        </option>

    </select>

    <br><br>


    <!-- DIET -->
    <label>Diet:</label>

    <select name="diet" required>

        <option value="">Select Diet</option>

        <option value="Vegetarian"
            {% if profile.diet == "Vegetarian" %}selected{% endif %}>
            Vegetarian
        </option>

        <option value="Non-Vegetarian"
            {% if profile.diet == "Non-Vegetarian" %}selected{% endif %}>
            Non-Vegetarian
        </option>

        <option value="Vegan"
            {% if profile.diet == "Vegan" %}selected{% endif %}>
            Vegan
        </option>

    </select>

    <br><br>


    <!-- MEDICAL CONDITIONS -->
    <label>Medical Conditions:</label>
    <br>

    <textarea
        name="medical_conditions"
        rows="4"
        cols="40"
        placeholder="Enter medical conditions if any"
    >{{ profile.medical_conditions|default:'' }}</textarea>

    <br><br>


    <!-- DIETARY RESTRICTIONS -->
    <label>Dietary Restrictions:</label>
    <br>

    <textarea
        name="dietary_restrictions"
        rows="4"
        cols="40"
        placeholder="Enter dietary restrictions if any"
    >{{ profile.dietary_restrictions|default:'' }}</textarea>

    <br><br>


    <button type="submit">
        Save Health Profile
    </button>

</form>

</body>
</html>
